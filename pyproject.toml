[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "preflight-rehearsal"
version = "0.1.0"
description = "Controlled PostgreSQL migration rehearsal with immutable evidence"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp==2.2.0", "pydantic>=2.11,<3", "psycopg[binary]>=3.2,<4", "pglast==8.4", "boto3>=1.40,<2", "typer>=0.16,<1", "filelock>=3.18,<4"]

[project.scripts]
preflight = "preflight.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "mypy>=1.17,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/preflight"]

[tool.hatch.build.targets.sdist]
skip-excluded-dirs = true
exclude = ["/.worktrees", "/.venv", "/.venv-clean", "/var", "/dist", "**/node_modules", "**/*.local.json", "**/*.pem", "**/*.key", "**/*.sqlite*", "**/*.log", "/.env"]

[tool.hatch.build.targets.sdist.force-include]
"evidence/local/verification.json" = "evidence/local/verification.json"
"evidence/local/pass-mcp-report.json" = "evidence/local/pass-mcp-report.json"
"evidence/local/pass-mcp-report.md" = "evidence/local/pass-mcp-report.md"
"evidence/local/block-mcp-report.json" = "evidence/local/block-mcp-report.json"
"evidence/local/block-mcp-report.md" = "evidence/local/block-mcp-report.md"
"evidence/connected/local-sandbox-canaries.json" = "evidence/connected/local-sandbox-canaries.json"
"evidence/connected/saved-agent-code-mode.json" = "evidence/connected/saved-agent-code-mode.json"
"evidence/connected/cleanup-approval-request.json" = "evidence/connected/cleanup-approval-request.json"
"evidence/connected/unlimited-rehearsal.json" = "evidence/connected/unlimited-rehearsal.json"
"evidence/connected/unlimited-code-mode-progress.json" = "evidence/connected/unlimited-code-mode-progress.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]
markers = ["unit: local pure checks", "postgres: disposable real PostgreSQL", "mcp: local official MCP transport", "cloud: local injected AWS client checks", "trueforge: pinned local integration checks", "live: requires authorized connected providers"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
